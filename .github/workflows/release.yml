# Based partially on Alyxia's work, thanks so much!

name: Release
on:
  push:
    tags:
      - v*

env:
  FORCE_COLOR: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Install Go dependencies
        run: go get -v
      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply patches/wayland.patch

      - name: Build GUI (X11)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags static -ldflags "-s
          -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          Equilotl-x11

      - name: Build GUI (Wayland)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static wayland"
          -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git
          rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{
          github.ref_name }}'" -o Equilotl-wayland

      - name: Build GUI (Combined)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static combined"
          -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git
          rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{
          github.ref_name }}'" -o Equilotl

      - name: Build CLI
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "cli" -ldflags "-s
          -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          PrivcordCli-linux

      - name: Update executable
        run: |
          chmod +x Privcord*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Privcord-linux
          path: |
            Privcord-x11
            PrivcordCli-linux

  build-mac:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            artifact_name: Equilotl-macos
            gui_name: Equilotl-darwin-x64.zip
            cli_name: EquilotlCli-darwin-x64
          - arch: arm64
            runner: macos-latest
            artifact_name: Equilotl-macos-arm64
            gui_name: Equilotl-darwin-arm64.zip
            cli_name: EquilotlCli-darwin-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-

      - name: Install dependencies
        run: brew install sdl2

      - name: Install Go dependencies
        run: go get -v

      - name: Build GUI
        run: CGO_CFLAGS="-mmacosx-version-min=10.15" CGO_LDFLAGS="-mmacosx-version-min=10.15" CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -v -tags "static gui" -ldflags "-s -w -X 'vencord/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'vencord/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Privcord

      - name: Update executable
        run: |
          chmod +x Privcord*

      - name: Generate MacOS GUI bundle
        run: |
          mkdir -p Privcord.app/Contents/MacOS
          mkdir -p Privcord.app/Contents/Resources
          cp macos/Info.plist Privcord.app/Contents/Info.plist
          mv Privcord Privcord.app/Contents/MacOS/Privcord
          cp macos/icon.icns Privcord.app/Contents/Resources/icon.icns
          zip -r Privcord.MacOS.zip Privcord.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Privcord-macos
          path: |
            Privcord.MacOS.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit

      - name: Install Windows dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@latest

      - name: Build GUI
        shell: msys2 {0}
        run: |
          go-winres make --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Privcord.exe

      - name: Build CLI
        shell: msys2 {0}
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "cli" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o PrivcordCli.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Privcord-windows
          path: |
            Privcord.exe
            PrivcordCli.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-mac, build-windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: "Download Linux Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: Privcord-linux
          path: linux

      - name: "Download MacOS Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: Privcord-macos
          path: macos

      - uses: actions/download-artifact@v8
        with:
          name: Equilotl-macos-arm64
          path: macos

      - name: "Download Windows Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: Privcord-windows
          path: windows

      - name: Delete existing release
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          make_latest: ${{ !contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          body: |
            This is release ${{ github.ref_name }} of Privcord.
          files: |
            linux/Privcord-x11
            linux/PrivcordCli-linux
            macos/Privcord.MacOS.zip
            windows/Privcord*.exe
